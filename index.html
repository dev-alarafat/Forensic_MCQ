<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Forensic Medicine MCQ Quiz — Abdullah Al Arafat (SBMC55)</title>
<meta name="theme-color" content="#1e3a8a">
<style>
:root {
  --bg: #f3f6fc;
  --cd: #ffffff;
  --cd-h: #f8faff;
  --tx: #0f172a;
  --mu: #64748b;
  --bd: #e2e8f0;
  --ac: #2563eb;
  --ac-d: #1d4ed8;
  --acb: #eff6ff;
  --ok: #15803d;
  --okb: #dcfce7;
  --ng: #b91c1c;
  --ngb: #fee2e2;
  --sk: #b45309;
  --skb: #fef3c7;
  --gd: #d97706;
  --gdb: #fef3c7;
  --sh: 0 4px 20px -2px rgba(15, 23, 42, 0.06), 0 2px 6px -1px rgba(15, 23, 42, 0.04);
  --sh-lg: 0 10px 30px -5px rgba(37, 99, 235, 0.14);
  --h: 3.6rem;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}

:root[data-theme=dark] {
  --bg: #0b0f19;
  --cd: #151c2c;
  --cd-h: #1e293b;
  --tx: #f1f5f9;
  --mu: #94a3b8;
  --bd: #263147;
  --ac: #60a5fa;
  --ac-d: #3b82f6;
  --acb: #1e293b;
  --ok: #4ade80;
  --okb: #0f291e;
  --ng: #f87171;
  --ngb: #2e1519;
  --sk: #fbbf24;
  --skb: #2e2412;
  --gd: #fbbf24;
  --gdb: #2e2412;
  --sh: 0 4px 20px -2px rgba(0, 0, 0, 0.35);
  --sh-lg: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { height: 100%; -webkit-text-size-adjust: 100%; scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--tx);
  font: 1rem/1.55 'Inter', system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans Bengali", sans-serif;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
body::before {
  content: "";
  position: fixed;
  inset: 0 0 auto;
  height: env(safe-area-inset-top, 0px);
  background: var(--cd);
  z-index: 30;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; transition: all 0.18s ease; }
button:active:not(:disabled) { transform: scale(0.97); }
button:disabled { opacity: 0.5; cursor: not-allowed; }

/* Header & Navigation */
header {
  position: sticky;
  top: env(safe-area-inset-top, 0px);
  z-index: 25;
  height: var(--h);
  display: flex;
  align-items: center;
  gap: .4rem;
  padding: 0 .75rem;
  background: color-mix(in srgb, var(--cd) 88%, transparent);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--bd);
}
.hdr-left { display: flex; align-items: center; gap: .35rem; flex: 1; min-width: 0; }
.title-wrap { flex: 1; min-width: 0; padding-left: .2rem; }
header h1 {
  margin: 0;
  font-size: 1rem;
  font-weight: 700;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  letter-spacing: -0.01em;
}
.crumb {
  display: block;
  font-size: .72rem;
  color: var(--mu);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.1;
}
.icon-btn {
  min-width: 2.35rem;
  height: 2.35rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border: 1px solid var(--bd);
  background: var(--bg);
  border-radius: .7rem;
  font-weight: 650;
  font-size: .92rem;
  padding: 0 .5rem;
}
.icon-btn:hover { border-color: var(--ac); color: var(--ac); background: var(--acb); }
.icon-btn[hidden] { display: none; }

/* Main Container */
#app {
  width: 100%;
  max-width: 48rem;
  margin: 0 auto;
  padding: 1rem .9rem 2.5rem;
  flex: 1;
}

/* Hero Banner on Home */
.hero {
  background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 60%, #0ea5e9 100%);
  color: #fff;
  border-radius: 1.25rem;
  padding: 1.35rem 1.25rem;
  margin-bottom: 1.1rem;
  box-shadow: var(--sh-lg);
  position: relative;
  overflow: hidden;
}
.hero-bg-icon {
  position: absolute;
  right: -1rem;
  bottom: -1rem;
  width: 120px;
  height: 120px;
  opacity: 0.12;
  color: #fff;
  pointer-events: none;
}
.hero-tag {
  display: inline-block;
  background: rgba(255, 255, 255, 0.18);
  backdrop-filter: blur(4px);
  padding: .2rem .65rem;
  border-radius: 2rem;
  font-size: .75rem;
  font-weight: 600;
  letter-spacing: .03em;
  margin-bottom: .45rem;
}
.hero h2 {
  margin: 0 0 .25rem;
  font-size: 1.35rem;
  font-weight: 800;
  color: #fff;
  text-transform: none;
  letter-spacing: -0.02em;
}
.hero p { margin: 0; font-size: .88rem; opacity: 0.9; }
.stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: .5rem;
  margin-top: 1rem;
  padding-top: .85rem;
  border-top: 1px solid rgba(255, 255, 255, 0.2);
}
.stat-box b { display: block; font-size: 1.1rem; font-weight: 800; }
.stat-box span { font-size: .74rem; opacity: 0.85; }

/* Section Headings */
h2.sec {
  font-size: .8rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: .06em;
  color: var(--mu);
  margin: 1.5rem .2rem .65rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.sub { color: var(--mu); margin: .2rem .2rem .9rem; font-size: .92rem; }

/* Cards & Grid */
.card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: .75rem;
  width: 100%;
  text-align: left;
  background: var(--cd);
  border: 1px solid var(--bd);
  border-radius: 1.05rem;
  padding: .95rem 1.05rem;
  margin: 0 0 .65rem;
  box-shadow: var(--sh);
  position: relative;
}
.card:hover {
  border-color: var(--ac);
  background: var(--cd-h);
  transform: translateY(-1px);
}
.card-icon {
  display: flex;
  align-items: center;
  gap: .5rem;
  font-weight: 650;
  font-size: .98rem;
}
.card-icon svg { color: var(--ac); }
.card-body { flex: 1; min-width: 0; }
.card-body b { display: block; font-size: .98rem; font-weight: 650; line-height: 1.35; }
.card-body small { display: block; color: var(--mu); margin-top: .2rem; font-size: .82rem; }
.card-right { display: flex; align-items: center; gap: .45rem; flex-shrink: 0; }
.pill {
  background: var(--okb);
  color: var(--ok);
  border-radius: 2rem;
  padding: .15rem .65rem;
  font-size: .76rem;
  font-weight: 700;
}
.arr { color: var(--mu); font-size: 1.1rem; font-weight: 600; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: .65rem; }
.row2 .card { margin: 0; align-items: flex-start; flex-direction: column; gap: .35rem; }

/* Chips & Mode Selectors */
.chips { display: flex; flex-wrap: wrap; gap: .45rem; margin: .35rem 0 .75rem; }
.chip {
  border: 1px solid var(--bd);
  background: var(--cd);
  border-radius: 2rem;
  padding: .4rem .9rem;
  font-size: .86rem;
  font-weight: 500;
}
.chip:hover { border-color: var(--ac); }
.chip.on {
  background: var(--ac);
  border-color: var(--ac);
  color: #fff;
  font-weight: 650;
}
:root[data-theme=dark] .chip.on { color: #0b0f19; }

.big {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  text-align: left;
  border: 1.5px solid var(--bd);
  background: var(--cd);
  border-radius: 1.15rem;
  padding: 1.1rem 1.2rem;
  margin: .65rem 0;
  font-size: 1.05rem;
  font-weight: 700;
  box-shadow: var(--sh);
}
.big:hover:not(:disabled) { border-color: var(--ac); background: var(--cd-h); }
.big-title { display: flex; align-items: center; gap: .6rem; }
.big small { display: block; font-weight: 400; color: var(--mu); font-size: .86rem; margin-top: .25rem; margin-left: 2rem; }

/* Sticky Sub-bar & Progress */
.bar {
  position: sticky;
  top: calc(env(safe-area-inset-top, 0px) + var(--h));
  z-index: 20;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  padding: .55rem 0 .45rem;
  margin: 0 0 .65rem;
  border-bottom: 1px solid var(--bd);
}
.bar-top { display: flex; align-items: center; gap: .45rem; }
.bar-top span { flex: 1; color: var(--mu); font-size: .86rem; font-weight: 600; }
.bar-top button {
  display: inline-flex;
  align-items: center;
  gap: .35rem;
  border: 1px solid var(--bd);
  background: var(--cd);
  border-radius: .65rem;
  padding: .38rem .75rem;
  font-size: .84rem;
  font-weight: 600;
}
.bar-top button:hover { border-color: var(--ac); color: var(--ac); }
.prog {
  height: 5px;
  background: var(--bd);
  border-radius: 99px;
  overflow: hidden;
  margin-top: .45rem;
}
.prog > div {
  height: 100%;
  background: linear-gradient(90deg, var(--ac), #0ea5e9);
  width: 0%;
  transition: width 0.25s ease;
}

/* Search Box */
.search-wrap {
  position: relative;
  margin: .45rem 0 0;
}
.search-wrap input {
  width: 100%;
  padding: .5rem .85rem .5rem 2.1rem;
  border: 1px solid var(--bd);
  border-radius: .75rem;
  background: var(--cd);
  font-size: .88rem;
  outline: none;
}
.search-wrap input:focus { border-color: var(--ac); box-shadow: 0 0 0 3px var(--acb); }
.search-icon {
  position: absolute;
  left: .65rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--mu);
  pointer-events: none;
  display: flex;
}

/* Question Card */
.q {
  background: var(--cd);
  border: 1px solid var(--bd);
  border-radius: 1.15rem;
  padding: 1rem 1rem .75rem;
  margin: 0 0 .95rem;
  box-shadow: var(--sh);
  scroll-margin-top: calc(var(--h) + 5.5rem);
}
.qh { display: flex; align-items: center; flex-wrap: wrap; gap: .4rem; margin-bottom: .55rem; }
.n {
  background: var(--ac);
  color: #fff;
  border-radius: .55rem;
  min-width: 2rem;
  text-align: center;
  font-weight: 750;
  font-size: .86rem;
  padding: .1rem .45rem;
}
:root[data-theme=dark] .n { color: #0b0f19; }
.bd {
  background: var(--bg);
  border: 1px solid var(--bd);
  border-radius: .5rem;
  padding: .08rem .5rem;
  font-size: .74rem;
  font-weight: 600;
  color: var(--mu);
}
.st {
  margin-left: auto;
  border: 0;
  background: none;
  color: var(--bd);
  padding: .1rem .3rem;
  display: flex;
  align-items: center;
}
.st.on { color: #f59e0b; transform: scale(1.08); }
.stem { font-weight: 650; font-size: 1.04rem; margin: .15rem 0 .75rem; line-height: 1.45; }

/* Options */
.o {
  border: 1px solid var(--bd);
  border-left-width: 4px;
  border-radius: .8rem;
  padding: .6rem .75rem;
  margin: .45rem 0;
  background: var(--bg);
  transition: background 0.15s, border-color 0.15s;
}
.or { display: flex; align-items: center; gap: .6rem; }
.or b {
  color: var(--mu);
  min-width: 1.35rem;
  height: 1.35rem;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  background: var(--cd);
  border-radius: .4rem;
  font-size: .82rem;
  border: 1px solid var(--bd);
}
.or .t { flex: 1; font-size: .95rem; }
.tf {
  font-size: .75rem;
  font-weight: 700;
  border-radius: .45rem;
  padding: .1rem .55rem;
  white-space: nowrap;
}
.tf.T { background: var(--okb); color: var(--ok); }
.tf.F { background: var(--ngb); color: var(--ng); }
.tf2 { font-size: .78rem; color: var(--mu); white-space: nowrap; }
.tf2 b.T { color: var(--ok); }
.tf2 b.F { color: var(--ng); }
.tt { border-left-color: var(--ok); }
.ff { border-left-color: var(--ng); }
.o.ok { background: var(--okb); border-color: var(--ok); }
.o.bad { background: var(--ngb); border-color: var(--ng); }
.o.sk { background: var(--skb); border-color: var(--sk); }
.ex {
  font-size: .85rem;
  color: var(--mu);
  margin: .35rem 0 0 1.95rem;
  padding-top: .25rem;
  border-top: 1px dashed var(--bd);
}
.help {
  display: flex;
  gap: .5rem;
  background: var(--acb);
  border-left: 3px solid var(--ac);
  border-radius: .65rem;
  padding: .65rem .85rem;
  margin: .6rem 0 .2rem;
  font-size: .9rem;
}
.help-icon { color: var(--ac); flex-shrink: 0; margin-top: .15rem; }
.tap { cursor: pointer; }
.tap:hover { border-color: var(--ac); }
.tap.sel { background: var(--acb); border-color: var(--ac); }
.tg { display: flex; gap: .35rem; }
.tg button {
  width: 2.5rem;
  height: 2.25rem;
  border: 1px solid var(--bd);
  background: var(--cd);
  border-radius: .55rem;
  font-weight: 750;
  font-size: .85rem;
}
.tg button.on.t-btn { background: var(--ok); border-color: var(--ok); color: #fff; }
.tg button.on.f-btn { background: var(--ng); border-color: var(--ng); color: #fff; }
:root[data-theme=dark] .tg button.on { color: #0b0f19; }

.hide .tf, .hide .ex, .hide .help { display: none; }
.hide .o { border-color: var(--bd); }
.hide .o.ok { background: var(--bg); }

/* Chapter Prev/Next Nav */
.chap-nav {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: .65rem;
  margin: 1.5rem 0 .5rem;
}
.chap-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .45rem;
  padding: .75rem;
  border-radius: .85rem;
  border: 1px solid var(--bd);
  background: var(--cd);
  font-weight: 650;
  font-size: .9rem;
  transition: all 0.2s;
  color: var(--tx);
}
.chap-btn svg { color: var(--mu); }
.chap-btn:hover { border-color: var(--ac); background: var(--cd-h); color: var(--ac); }
.chap-btn:hover svg { color: var(--ac); }

/* Fixed Submit Footer */
.fix {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 25;
  padding: .65rem .85rem calc(.65rem + env(safe-area-inset-bottom, 0px));
  background: color-mix(in srgb, var(--cd) 90%, transparent);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--bd);
}
.pri {
  display: block;
  width: 100%;
  max-width: 48rem;
  margin: 0 auto;
  border: 0;
  background: linear-gradient(135deg, var(--ac), var(--ac-d));
  color: #fff;
  border-radius: .9rem;
  padding: .85rem;
  font-weight: 700;
  font-size: 1rem;
  box-shadow: 0 4px 14px rgba(37, 99, 235, 0.35);
}

/* Results Box */
.res {
  background: var(--cd);
  border: 1px solid var(--bd);
  border-radius: 1.2rem;
  padding: 1.25rem 1rem;
  margin-bottom: .9rem;
  text-align: center;
  box-shadow: var(--sh);
}
.res .sc { font-size: 2.6rem; font-weight: 850; color: var(--ac); line-height: 1.1; }
.res .btns { display: flex; gap: .55rem; margin-top: .9rem; }
.res .btns button {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: .4rem;
  flex: 1;
  border: 1px solid var(--bd);
  background: var(--bg);
  border-radius: .8rem;
  padding: .65rem;
  font-weight: 650;
}
.res .btns button:hover { border-color: var(--ac); color: var(--ac); }

/* Modals / Bottom Sheets */
.ov {
  position: fixed;
  inset: 0;
  z-index: 40;
  background: rgba(15, 23, 42, 0.55);
  backdrop-filter: blur(3px);
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.sheet-box {
  background: var(--cd);
  width: 100%;
  max-width: 48rem;
  max-height: 78vh;
  display: flex;
  flex-direction: column;
  border-radius: 1.35rem 1.35rem 0 0;
  padding: 1rem 1rem calc(1rem + env(safe-area-inset-bottom, 0px));
  box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.2);
}
.sheet-hdr {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-bottom: .65rem;
  margin-bottom: .65rem;
  border-bottom: 1px solid var(--bd);
}
.sheet-hdr b { font-size: 1rem; }
.sheet-legend {
  display: flex;
  gap: .8rem;
  font-size: .76rem;
  color: var(--mu);
  margin-bottom: .75rem;
  flex-wrap: wrap;
}
.sheet-legend span { display: inline-flex; align-items: center; gap: .3rem; }
.dot { width: .65rem; height: .65rem; border-radius: 50%; display: inline-block; }
.sheet {
  overflow-y: auto;
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(2.85rem, 1fr));
  gap: .45rem;
  padding: .1rem;
}
.sheet button {
  height: 2.75rem;
  border: 1px solid var(--bd);
  background: var(--bg);
  border-radius: .7rem;
  font-weight: 650;
  position: relative;
}
.sheet .ok { background: var(--okb); color: var(--ok); border-color: var(--ok); }
.sheet .bad { background: var(--ngb); color: var(--ng); border-color: var(--ng); }
.sheet .on { background: var(--acb); color: var(--ac); border-color: var(--ac); }
.topic-list { overflow-y: auto; display: flex; flex-direction: column; gap: .4rem; }
.topic-item {
  text-align: left;
  padding: .75rem .9rem;
  border-radius: .8rem;
  border: 1px solid var(--bd);
  background: var(--bg);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: .5rem;
}
.topic-item.cur { border-color: var(--ac); background: var(--acb); color: var(--ac); font-weight: 700; }

/* Floating Back to Top */
#top {
  position: fixed;
  right: .9rem;
  bottom: 5.2rem;
  z-index: 22;
  width: 2.75rem;
  height: 2.75rem;
  border-radius: 50%;
  border: 1px solid var(--bd);
  background: var(--cd);
  box-shadow: var(--sh);
  display: none;
  font-weight: 700;
  align-items: center;
  justify-content: center;
}

/* Custom Credit Footer */
footer.credit {
  width: 100%;
  max-width: 48rem;
  margin: auto auto 0;
  padding: 1.5rem .9rem calc(4.5rem + env(safe-area-inset-bottom, 0px));
  text-align: center;
}
.credit-card {
  background: var(--cd);
  border: 1px solid var(--bd);
  border-radius: 1rem;
  padding: .85rem 1.1rem;
  display: inline-flex;
  align-items: center;
  gap: .65rem;
  box-shadow: var(--sh);
  font-size: .86rem;
}
.credit-badge {
  background: linear-gradient(135deg, #1e3a8a, #2563eb);
  color: #fff;
  font-weight: 750;
  font-size: .74rem;
  padding: .2rem .55rem;
  border-radius: .45rem;
  letter-spacing: .03em;
}
.credit-text { color: var(--mu); }
.credit-text b { color: var(--tx); font-weight: 750; }


/* Usability refinement: calmer spacing, clearer hierarchy, easier tapping */
header { gap: .35rem; padding-inline: max(.75rem, calc((100vw - 48rem) / 2)); }
header .icon-btn { flex: 0 0 auto; }
#app { padding-top: 1.15rem; padding-bottom: 3rem; }
.hero { padding: 1.5rem 1.35rem 1.25rem; border-radius: 1.15rem; box-shadow: 0 8px 24px -12px rgba(37,99,235,.45); }
.hero h2 { max-width: 34rem; font-size: clamp(1.3rem, 4vw, 1.65rem); line-height: 1.25; margin-top: .1rem; }
.hero p { max-width: 34rem; line-height: 1.5; margin-top: .4rem; }
.hero-tag { font-size: .69rem; letter-spacing: .055em; }
.stats-row { gap: .75rem; margin-top: 1.1rem; padding-top: .9rem; }
.stat-box b { font-size: 1.25rem; line-height: 1.3; }
.stat-box span { font-size: .76rem; }
h2.sec { margin-top: 1.65rem; margin-bottom: .7rem; font-size: .76rem; letter-spacing: .045em; gap: .6rem; }
.card { border-radius: .9rem; padding: .9rem 1rem; margin-bottom: .55rem; box-shadow: 0 2px 8px rgba(15,23,42,.035); }
.card:hover { transform: translateY(-1px); }
.card-body b { line-height: 1.4; }
.card-body small { line-height: 1.45; }
.row2 { gap: .65rem; }

      if (m === 'L') {
        c += x.a ? ' tt' : ' ff';
        r = `<span class="tf ${x.a ? 'T' : 'F'}">${x.a ? 'True' : 'False'}</span>`;
      } else if (qm) {
        r = `<span class="tg"><button data-a="m" data-q="${q.id}" data-k="${x.k}" data-v="1" class="t-btn ${g === true ? 'on' : ''}">T</button><button data-a="m" data-q="${q.id}" data-k="${x.k}" data-v="0" class="f-btn ${g === false ? 'on' : ''}">F</button></span>`;
      } else {
        c += g === undefined ? ' sk' : g === x.a ? ' ok' : ' bad';
        r = `<span class="tf2">You: ${g === undefined ? '–' : g ? 'T' : 'F'} · Ans: <b class="${x.a ? 'T' : 'F'}">${x.a ? 'T' : 'F'}</b></span>`;
      }
      o += `<div class="${c}"><div class="or"><b>${x.k}</b><span class="t">${E(x.t)}</span>${r}</div>${m !== 'Q' || rv ? (x.e ? `<div class="ex">${E(x.e)}</div>` : '') : ''}</div>`;
    });
  } else {
    q.o.forEach(x => {
      let c = 'o';
      if (m === 'L' && x.k === q.s) c += ' ok';
      if (qm) c += ' tap' + (a.s === x.k ? ' sel' : '');
      if (rv) {
        if (x.k === q.s) c += ' ok';
        else if (a.s === x.k) c += ' bad';
      }
      o += `<div class="${c}" ${qm ? `data-a="s" data-q="${q.id}" data-k="${x.k}"` : ''}><div class="or"><b>${x.k}</b><span class="t">${E(x.t)}</span>${(m === 'L' || rv) && x.k === q.s ? '<span class="tf T">✓ Correct</span>' : ''}${rv && a.s === x.k && x.k !== q.s ? '<span class="tf F">Your answer</span>' : ''}</div></div>`;
    });
  }
  return `<article class="q" id="c-${q.id}"><div class="qh"><span class="n">#${i + 1}</span><span class="bd">${q.ty.toUpperCase()}</span>${q.ex ? `<span class="bd">${E(q.ex)}</span>` : ''}${q.tg ? `<span class="bd">${E(q.tg)}</span>` : ''}</div><p class="stem">${E(q.q)}</p>${o}${m !== 'Q' || rv ? (q.h ? `<div class="help"><span class="help-icon">${I.help}</span><div>${E(q.h)}</div></div>` : '') : ''}</article>`;
}

function sc(q) {
  const a = (V.ans || {})[q.id] || {};
  if (q.ty === 'sba') return { f: a.s === q.s, u: 1, c: a.s === q.s ? 1 : 0, an: a.s !== undefined };
  let c = 0;
  q.o.forEach(x => { if (a[x.k] === x.a) c++; });
  return { f: c === q.o.length, u: q.o.length, c, an: Object.keys(a).length > 0 };
}

const pool = t => t.qs.filter(q => (!V.ex || q.ex === V.ex));

const tc = t => {
  const b = S.best[t.id];
  return `<button class="card" data-topic-card data-topic="${E(t.name.toLowerCase())}" data-a="open" data-t="${t.id}">
    <div class="card-body"><b>${E(t.name)}</b><small>${t.qs.length} questions</small></div>
    <div class="card-right">${b != null ? `<span class="pill">Best ${b}%</span>` : ''}<span class="arr">›</span></div>
  </button>`;
};

function chapNav(currId) {
  const idx = TP.findIndex(x => x.id === currId);
  if (idx === -1) return '';
  const prev = TP[idx - 1], next = TP[idx + 1];
  return `<div class="chap-nav">
    ${prev ? `<button class="chap-btn" data-a="open" data-t="${prev.id}">${I.prev} Previous Topic</button>` : '<div></div>'}
    ${next ? `<button class="chap-btn" data-a="open" data-t="${next.id}">Next Topic ${I.next}</button>` : '<div></div>'}
  </div>`;
}

function R() {
  const a = $('#app');
  document.documentElement.dataset.theme = S.theme;
  document.documentElement.style.fontSize = (S.fs * 100) + '%';
  $('#thb').textContent = S.theme === 'dark' ? '☀' : '☾';

  const isHome = V.v === 'home';
  document.body.classList.toggle('is-home', isHome);
  $('#backBtn').hidden = isHome;
  $('#homeBtn').hidden = isHome;

  let h = '', t = 'Forensic Medicine MCQ', cr = 'Sher-e-Bangla Medical College (SBMC55)';

  if (isHome) {
    h = `
      <div class="hero">
        ${I.scale}
        <span class="hero-tag">PROKORSHO 55 · ACADEMIC PORTAL</span>
        <h2>Forensic Medicine & Toxicology</h2>
        <p>Complete Matrix & DU Chapter-wise Question Bank</p>
        <div class="stats-row">
          <div class="stat-box"><b>${ALL.length}</b><span>Total MCQs</span></div>
          <div class="stat-box"><b>${TP.length}</b><span>Chapters</span></div>
        </div>
      </div>
      <div class="topic-group" data-topic-group="matrix">
        <h2 class="sec"><span>Matrix Question Bank</span><span>2024–2026 · SBA + MTF</span></h2>
        ${TP.filter(x => x.mx).map(tc).join('')}
      </div>
      <div class="topic-group" data-topic-group="du">
        <h2 class="sec"><span>DU Chapter-wise Bank</span><span>2015–2025 · ${TP.filter(x => !x.mx).length} Chapters</span></h2>
        ${TP.filter(x => !x.mx).map(tc).join('')}
      </div>
    `;
    const heroIcon = a.querySelector('.hero'); // to insert SVG dynamically
    if (heroIcon) heroIcon.innerHTML = I.scale + heroIcon.innerHTML; // Wait, I already added it in the string. I need to give it class.
    
    // Fix hero icon class
    h = h.replace(I.scale, `<div class="hero-bg-icon">${I.scale}</div>`);

  } else if (V.v === 'topic') {
    const T0 = V.t;
    t = T0.name;
    cr = 'Topic Overview & Setup';
    const p = pool(T0), n = p.length;
    let f = '';
    if (T0.mx) {
      const ex = [...new Set(T0.qs.map(q => q.ex))];
      f = `<h2 class="sec">Filter by Exam Session</h2>
           <div class="chips">${['', ...ex].map(x => `<button class="chip ${V.ex === x ? 'on' : ''}" data-a="ex" data-x="${x}">${x || 'All Sessions'}</button>`).join('')}</div>`;
    }
    h = `<p class="sub">${n} questions available in this selection</p>
         ${f}
         <button class="big" data-a="lesson" ${n ? '' : 'disabled'}>
           <div><div class="big-title">${I.book} <span>Study / Lesson Mode</span></div><small>Read all questions in order with instant answers & explanations</small></div>
           <span class="arr">›</span>
         </button>
         <button class="big" data-a="quiz" ${n ? '' : 'disabled'}>
           <div><div class="big-title">${I.edit} <span>Start Quiz</span></div><small>${n} questions · Shuffled order · Instant results</small></div>
           <span class="arr">›</span>
         </button>
         ${n ? '' : '<p class="sub">No questions match this filter.</p>'}
         ${chapNav(T0.id)}`;
  } else if (V.v === 'lesson') {
    t = V.name;
    cr = 'Lesson Mode · Study View';
    const filtered = V.qs.map((q, i) => [q, i]);

    h = `<div class="bar">
           <div class="bar-top">
             <span>${V.qs.length} questions</span>
             <button data-a="hide">${V.hide ? I.eye : I.eyeOff} <span>${V.hide ? 'Show' : 'Hide'} Answers</span></button>
           </div>
         </div>
         <div id="list" class="${V.hide ? 'hide' : ''}">
           ${filtered.map(([q, i]) => card(q, i, 'L')).join('')}
         </div>
         ${V.tv && V.tv.t ? chapNav(V.tv.t.id) : ''}`;
  } else {
    t = V.name;
    cr = V.sub ? 'Quiz Review' : 'Active Quiz Mode';
    const N = V.qs.length;
    let r = '';
    if (V.sub) {
      const z = V.qs.map(sc), u = z.reduce((s, x) => s + x.u, 0), c = z.reduce((s, x) => s + x.c, 0), fl = z.filter(x => x.f).length, pc = Math.round(100 * c / u);
      r = `<div class="res">
             <div class="sc">${pc}%</div>
             <div style="font-weight:650;margin-top:.2rem">${fl} of ${N} questions fully correct · ${c}/${u} statements right</div>
             <div class="btns">
               ${fl < N ? `<button data-a="retry">${I.refresh} Retry Wrong (${N - fl})</button>` : ''}
               <button data-a="again">${I.plusStar} New Quiz</button>
             </div>
           </div>
           <div class="chips">
             ${[['all', 'All (' + N + ')'], ['bad', 'Wrong (' + (N - fl) + ')'], ['ok', 'Correct (' + fl + ')']].map(x => `<button class="chip ${V.flt === x[0] ? 'on' : ''}" data-a="flt" data-x="${x[0]}">${x[1]}</button>`).join('')}
           </div>`;
    }
    const L = V.qs.map((q, i) => [q, i]).filter(([q]) => !V.sub || V.flt === 'all' || (V.flt === 'ok') === sc(q).f);
    h = `<div class="bar">
           <div class="bar-top">
             <span id="cnt">${V.sub ? 'Quiz Completed · Review Answers' : ''}</span>
           </div>
           ${V.sub ? '' : '<div class="prog"><div id="progBar"></div></div>'}
         </div>
         ${r}
         <div id="list">${L.map(([q, i]) => card(q, i, 'Q')).join('')}</div>
         ${V.sub ? (V.tv && V.tv.t ? chapNav(V.tv.t.id) : '') : '<div class="fix"><button class="pri" data-a="submit" id="sb"></button></div>'}`;
  }

  $('#ttl').textContent = t;
  $('#crumb').textContent = cr;
  a.innerHTML = h;


  if (V.v === 'quiz' && !V.sub) cnt();
}

function cnt() {
  const n = V.qs.filter(q => sc(q).an).length;
  const tot = V.qs.length;
  const pct = tot ? Math.round((n / tot) * 100) : 0;
  if ($('#cnt')) $('#cnt').textContent = `${n} of ${tot} answered (${pct}%)`;
  if ($('#sb')) $('#sb').textContent = `Submit Quiz (${n}/${tot})`;
  if ($('#progBar')) $('#progBar').style.width = pct + '%';
}

function go(v) {
  V = v;
  R();
  scrollTo(0, 0);
}

function startQ(qs, name, tv, retry) {
  go({ v: 'quiz', qs: shuf(qs), name, ans: {}, sub: false, flt: 'all', tv, tid: tv.t.id, retry });
}

function upd(q) {
  const i = V.qs.indexOf(q);
  $('#c-' + q.id).outerHTML = card(q, i, 'Q');
  cnt();
}

function confirmLeave() {
  return !(V.v === 'quiz' && V.ans && !V.sub && Object.keys(V.ans).length && !confirm('Leave active quiz? Your current progress will be lost.'));
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-a]');
  if (!b) return;
  const d = b.dataset, a = d.a, qq = d.q && ALL.find(x => x.id === d.q);

  if (a === 'th') { S.theme = S.theme === 'dark' ? 'light' : 'dark'; ST(); R(); }
  else if (a === 'fs') { S.fs = Math.min(1.35, Math.max(0.85, S.fs + 0.07 * d.d)); ST(); R(); }
  else if (a === 'top') scrollTo({ top: 0, behavior: 'smooth' });
  else if (a === 'home') { if (!confirmLeave()) return; go({ v: 'home' }); }
  else if (a === 'back') { if (!confirmLeave()) return; go(V.tv || { v: 'home' }); }
  else if (a === 'open') {
    if (!confirmLeave()) return;
    const closeOv = document.querySelector('.ov');
    if (closeOv) closeOv.remove();
    const t = TP.find(x => x.id === d.t);
    go({ v: 'topic', t, ex: '', n: 0 });
  }
  else if (a === 'ex') { V.ex = d.x; R(); }
    else if (a === 'lesson') {
    const p = V.t.id === 'bm' ? V.t.qs : pool(V.t);
    go({ v: 'lesson', qs: p, name: V.t.name, hide: false, qSearch: '', tv: V });
  }
  else if (a === 'quiz') {
    const p = shuf(V.t.id === 'bm' ? V.t.qs : pool(V.t));
    startQ(p, V.t.name, V);
  }
  else if (a === 'hide') {
    V.hide = !V.hide;
    $('#list').classList.toggle('hide', V.hide);
    b.innerHTML = V.hide ? `${I.eye} <span>Show Answers</span>` : `${I.eyeOff} <span>Hide Answers</span>`;
  }
  else if (a === 'm') {
    (V.ans[qq.id] = V.ans[qq.id] || {})[d.k] = d.v === '1';
    upd(qq);
  }
  else if (a === 's') {
    (V.ans[qq.id] = V.ans[qq.id] || {}).s = d.k;
    upd(qq);
  }
  else if (a === 'submit') {
    if (!V.qs.some(q => sc(q).an)) return;
    V.sub = true;
    if (!V.retry) {
      const z = V.qs.map(sc), u = z.reduce((s, x) => s + x.u, 0), c = z.reduce((s, x) => s + x.c, 0), p = Math.round(100 * c / u);
      S.best[V.tid] = Math.max(S.best[V.tid] || 0, p);
      ST();
    }
    R();
    scrollTo(0, 0);
  }
  else if (a === 'flt') { V.flt = d.x; R(); }
  else if (a === 'retry') { startQ(V.qs.filter(q => !sc(q).f), V.name, V.tv, true); }
  else if (a === 'again') go(V.tv);
  else if (a === 'closeOv') {
    const ov = document.querySelector('.ov');
    if (ov) ov.remove();
  }
  else if (a === 'to') {
    const ov = document.querySelector('.ov');
    if (ov) ov.remove();
    const el = $('#c-' + d.q);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
  }
});

document.addEventListener('click', e => {
  if (e.target.classList.contains('ov')) e.target.remove();
});

addEventListener('scroll', () => {
  $('#top').style.display = scrollY > 500 && V.v !== 'home' ? 'flex' : 'none';
}, { passive: true });

R();
</script>
</body>
</html>
